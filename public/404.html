<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Olaleye Victor</title>
    <script>
      // GitHub Pages has no SPA routing: remember the requested path and
      // send the visitor to the app, which restores it (see index.html).
      (function () {
        var base = '/';
        try {
          sessionStorage.setItem('spa-redirect', location.pathname + location.search + location.hash);
        } catch (e) {}
        location.replace(base);
      })();
    </script>
  </head>
  <body style="background:#000"></body>
</html>
