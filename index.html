<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0b" media="(prefers-color-scheme: dark)" />
    <title>Olaleye Victor</title>
    <meta name="description" content="Olaleye Victor, a creative technologist and Computer Science student at Vancouver Island University. Websites, software, brand design and art." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Olaleye Victor" />
    <meta property="og:description" content="Creative technologist. Websites, software, brand design and art." />
    <meta property="og:url" content="https://olavictor541.github.io/olaleyevictor/" />
    <meta property="og:image" content="https://olavictor541.github.io/olaleyevictor/avatar.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved or system theme before first paint (no flash)
      (function () {
        try {
          var t = localStorage.getItem('theme');
          var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
        // Restore a deep link saved by 404.html (GitHub Pages SPA fallback)
        try {
          var saved = sessionStorage.getItem('spa-redirect');
          if (saved) {
            sessionStorage.removeItem('spa-redirect');
            history.replaceState(null, '', saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
